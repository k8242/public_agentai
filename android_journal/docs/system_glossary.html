<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThreadLog System & Architecture Glossary</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Custom scrollbar styling for compact embed */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--card-border, #cbd5e1);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-0 m-0 text-sm">
  <div class="py-2 space-y-3">
    <!-- Header Controls -->
    <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center justify-between pb-2 border-b border-[var(--card-border)]">
      <div class="relative flex-1">
        <input 
          id="glossary-search" 
          type="text" 
          placeholder="Filter glossary by term, syntax, or keyword..." 
          class="w-full px-3 py-1.5 text-xs rounded-lg bg-[var(--card)] border border-[var(--border)] text-[var(--foreground)] placeholder-[var(--placeholder)] focus:outline-none focus:ring-1 focus:ring-[var(--primary)]"
        />
        <button id="clear-search" class="hidden absolute right-2.5 top-1.5 text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)]">✕</button>
      </div>
      <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0" id="category-bar">
        <button data-cat="ALL" class="cat-pill px-2.5 py-1 text-xs rounded-full font-medium transition-colors bg-[var(--primary)] text-[var(--primary-foreground)]">All (<span id="count-all">0</span>)</button>
        <button data-cat="FORMATTING" class="cat-pill px-2.5 py-1 text-xs rounded-full font-medium transition-colors bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]">Formatting (<span id="count-formatting">0</span>)</button>
        <button data-cat="FEATURE" class="cat-pill px-2.5 py-1 text-xs rounded-full font-medium transition-colors bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]">Features (<span id="count-feature">0</span>)</button>
        <button data-cat="ARCH" class="cat-pill px-2.5 py-1 text-xs rounded-full font-medium transition-colors bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]">Architecture (<span id="count-arch">0</span>)</button>
        <button data-cat="BACKUP" class="cat-pill px-2.5 py-1 text-xs rounded-full font-medium transition-colors bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]">Data & Backup (<span id="count-backup">0</span>)</button>
        <button data-cat="SECURITY" class="cat-pill px-2.5 py-1 text-xs rounded-full font-medium transition-colors bg-[var(--card)] border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]">Security (<span id="count-security">0</span>)</button>
      </div>
    </div>

    <!-- Active Count & Status Strip -->
    <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] px-1">
      <span id="results-count">Showing all terms</span>
      <span class="text-[10px] tracking-wide uppercase font-mono">ThreadLog v4.0</span>
    </div>

    <!-- Glossary Term Cards Container -->
    <div id="glossary-list" class="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-[500px] overflow-y-auto pr-1">
      <!-- Injected dynamically via JS -->
    </div>
  </div>

    let currentFilter = 'ALL';
    let searchQuery = '';

    function renderGlossary() {
      const container = document.getElementById('glossary-list');
      const searchVal = searchQuery.trim().toLowerCase();
      
      const filtered = GLOSSARY_DATA.filter(item => {
        const matchesCat = currentFilter === 'ALL' || item.category === currentFilter;
        if (!matchesCat) return false;
        if (!searchVal) return true;
        return (
          item.term.toLowerCase().includes(searchVal) ||
          item.description.toLowerCase().includes(searchVal) ||
          item.module.toLowerCase().includes(searchVal) ||
          (item.syntax && item.syntax.toLowerCase().includes(searchVal)) ||
          item.badge.toLowerCase().includes(searchVal)
        );
      });

      document.getElementById('results-count').textContent = `Showing ${filtered.length} of ${GLOSSARY_DATA.length} terms`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-8 text-center text-[var(--muted-foreground)]">
            <p class="font-medium">No matching glossary terms found.</p>
            <p class="text-xs mt-1">Try clearing filters or searching for terms like "bold", "FTS5", "TODO", or "OAuth".</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        let statusBadge = '';
        if (item.status === 'IMPLEMENTED') {
          statusBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-medium">Active</span>';
        } else if (item.status === 'PENDING_EXT') {
          statusBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-600 dark:text-amber-400 font-medium">SPI Hook</span>';
        } else if (item.status === 'PENDING_CONFIG') {
          statusBadge = '<span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-600 dark:text-blue-400 font-medium">User Setup</span>';
        }

        return `
          <div class="p-2.5 rounded-lg border border-[var(--border)] bg-[var(--card)] hover:border-[var(--primary)] transition-colors flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-2 mb-1">
                <span class="font-mono font-semibold text-xs text-[var(--primary)]">${escapeHtml(item.term)}</span>
                <div class="flex items-center gap-1">
                  <span class="text-[10px] px-1.5 py-0.5 rounded bg-[var(--card-border)] text-[var(--muted-foreground)] font-mono">${escapeHtml(item.badge)}</span>
                  ${statusBadge}
                </div>
              </div>
              <p class="text-xs text-[var(--foreground)] leading-relaxed mb-2">${escapeHtml(item.description)}</p>
            </div>
            <div class="pt-2 border-t border-[var(--card-border)]/60 flex items-center justify-between text-[11px] text-[var(--muted-foreground)]">
              <span class="font-mono text-[10px]">${escapeHtml(item.module)}</span>
              ${item.syntax ? `<code class="bg-[var(--card-border)]/50 px-1 py-0.5 rounded text-[10px] font-mono text-[var(--code-foreground)]">${escapeHtml(item.syntax)}</code>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function updateCounts() {
      document.getElementById('count-all').textContent = GLOSSARY_DATA.length;
      document.getElementById('count-formatting').textContent = GLOSSARY_DATA.filter(i => i.category === 'FORMATTING').length;
      document.getElementById('count-feature').textContent = GLOSSARY_DATA.filter(i => i.category === 'FEATURE').length;
      document.getElementById('count-arch').textContent = GLOSSARY_DATA.filter(i => i.category === 'ARCH').length;
      document.getElementById('count-backup').textContent = GLOSSARY_DATA.filter(i => i.category === 'BACKUP').length;
      document.getElementById('count-security').textContent = GLOSSARY_DATA.filter(i => i.category === 'SECURITY').length;
    }

    // Event Listeners
    document.getElementById('category-bar').addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-pill');
      if (!btn) return;
      currentFilter = btn.dataset.cat;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.classList.remove('bg-[var(--primary)]', 'text-[var(--primary-foreground)]');
        b.classList.add('bg-[var(--card)]', 'border', 'border-[var(--border)]', 'text-[var(--muted-foreground)]');
      });
      btn.classList.add('bg-[var(--primary)]', 'text-[var(--primary-foreground)]');
      btn.classList.remove('bg-[var(--card)]', 'border', 'border-[var(--border)]', 'text-[var(--muted-foreground)]');
      renderGlossary();
    });

    const searchInput = document.getElementById('glossary-search');
    const clearBtn = document.getElementById('clear-search');

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      if (searchQuery.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderGlossary();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.add('hidden');
      renderGlossary();
      searchInput.focus();
    });

    // Initialize
    updateCounts();
    renderGlossary();
  </script>
</body>
</html>
